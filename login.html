<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In • LWC Material</title>
  
  <meta name="theme-color" content="#020617">
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1xV-8qRtfqs0OzAc6AnhYc-jMmhj7v67H">

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #020617 75%);
      background-attachment: fixed;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 bg-indigo-600/10 blur-[120px] pointer-events-none -z-10 rounded-full"></div>

  <div class="glass-card w-full max-w-md p-6 sm:p-8 rounded-3xl shadow-2xl relative border border-slate-800">
    
    <!-- Logo Header -->
    <div class="text-center mb-6">
      <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-indigo-600/10 border border-indigo-500/20 flex items-center justify-center p-2 shadow-lg">
        <img src="https://lh3.googleusercontent.com/d/1xV-8qRtfqs0OzAc6AnhYc-jMmhj7v67H" 
             alt="LWC Logo" 
             class="w-full h-full object-contain"
             onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=LWC&background=6366f1&color=fff&bold=true';">
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">LWC Material</h1>
      <p class="text-xs text-indigo-300 mt-1">Student & Educator Access Portal</p>
    </div>

    <!-- Error Alert Box -->
    <div id="errorBox" class="hidden mb-4 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold leading-relaxed"></div>

    <!-- Success Alert Box -->
    <div id="successBox" class="hidden mb-4 p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold leading-relaxed"></div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Email Address</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
          <input type="email" id="email" required placeholder="student@example.com" 
                 class="w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition shadow-inner">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
          <input type="password" id="password" required placeholder="••••••••" 
                 class="w-full pl-10 pr-10 py-2.5 bg-slate-900/80 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition shadow-inner">
          <button type="button" onclick="togglePassword('password', 'loginEye')" class="absolute right-3.5 top-3 text-slate-400 hover:text-indigo-400 text-xs focus:outline-none p-0.5 transition" title="Toggle password visibility">
            <i id="loginEye" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" 
              class="w-full py-3 bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white rounded-xl text-xs font-bold transition duration-200 shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2">
        <span>Sign In</span>
      </button>
    </form>

    <p class="text-center text-xs text-slate-400 mt-6">
      Don't have an account? <a href="signup.html" class="text-indigo-400 font-semibold hover:underline">Register</a>
    </p>
  </div>

  <!-- Supabase Integration Script -->
  <script>
    const SUPABASE_URL = 'https://gwtmmylgkrlaofvleltt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_-2Kq5DSvdDJzObOn5RNzgQ_Vci8TTXM';
    
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // Check if user is already logged in
    async function checkExistingSession() {
      if (supabaseClient) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          window.location.href = 'index.html';
        }
      }
    }
    checkExistingSession();

    function togglePassword(inputId, eyeId) {
      const input = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      if (!input || !eye) return;
      if (input.type === "password") {
        input.type = "text";
        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");
      }
    }

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      errorBox.classList.add('hidden');
      successBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Signing in...</span>`;

      if (!supabaseClient) {
        errorBox.innerText = "Authentication service unavailable.";
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Sign In</span>`;
        return;
      }

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          throw error;
        }

        successBox.innerText = "Sign in successful! Redirecting to study portal...";
        successBox.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);

      } catch (err) {
        errorBox.innerText = err.message || "An error occurred during sign in.";
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Sign In</span>`;
      }
    });
  </script>
</body>
</html>
